# The Apple II test's ROM: 12K at $D000, the vectors at its top.
MEMORY {
    ROM:     start = $D000, size = $2FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFFA, size = $0006, type = ro, file = %O;
}
SEGMENTS {
    CODE:    load = ROM,     type = ro;
    VECTORS: load = VECTORS, type = ro;
}
