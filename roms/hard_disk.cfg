# The hard disk card's firmware: a page, at $C700 as in slot 7 (it runs in
# any), its last four bytes the ProDOS block device's.
MEMORY {
    ROM: start = $C700, size = $100, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = ROM, type = ro;
    TAIL: load = ROM, type = ro, start = $C7FC;
}
