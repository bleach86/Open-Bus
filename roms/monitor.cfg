# The monitor: 8K of ROM at $E000, its data at $D000. Programs have the rest:
# the zero page below $E0 and $0200-$CFFF.
MEMORY {
    ZP:      start = $00E0, size = $0020, type = rw, file = "";
    # $D000 and $D002: the NMI and IRQ vectors in RAM (crt0.s). Then the
    # monitor's data, and the C stack down from $E000.
    RAM:     start = $D004, size = $0FFC, type = rw, file = "", define = yes;
    ROM:     start = $E000, size = $1FF8, type = ro, file = %O, fill = yes, fillval = $FF;
    # The terminal: $FFF8 out, $FFF9 in.
    IO:      start = $FFF8, size = $0002, type = rw, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $FFFA, size = $0006, type = ro, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    STARTUP:  load = ROM,     type = ro;
    ONCE:     load = ROM,     type = ro, optional = yes;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    DATA:     load = ROM,     type = rw, run = RAM, define = yes;
    BSS:      load = RAM,     type = bss, define = yes;
    VECTORS:  load = VECTORS, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
