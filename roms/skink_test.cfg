# Skink's test boot image: 4K at the top of memory, its vectors at its top.
MEMORY {
    ROM:     start = $F000, size = $0FFA, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFFA, size = $0006, type = ro, file = %O;
}
SEGMENTS {
    CODE:    load = ROM,     type = ro;
    VECTORS: load = VECTORS, type = ro;
}
