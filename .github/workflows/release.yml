# A version tag, v0.2.0 say: the desktop app's installers for Linux, Windows
# and macOS, and the Android APK, built and put on a GitHub release of that
# tag. Run by hand (Actions → Release → Run workflow), it builds them all as
# artifacts of the run, without a release.
#
# The APK is signed with the release key, from four of the repository's
# secrets: ANDROID_KEYSTORE, the keystore in base64 (`base64 -w0 FILE`);
# ANDROID_KEYSTORE_PASSWORD; ANDROID_KEY_ALIAS; and ANDROID_KEY_PASSWORD.
# Without them, a tag's release fails rather than ship an APK that won't
# install over the last; run by hand, it's signed with a key made for the run.
#
# The desktop app updates itself from the latest release's latest.json
# (tools/updater-manifest), each update signed with the updater's key: two
# more secrets, TAURI_SIGNING_PRIVATE_KEY (the key file's contents, from
# `cargo tauri signer generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Without them, a tag's release fails too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tag has to be the version the app says it is.
      # An app released without the updater's real public key could never
      # update itself.
      - name: The updater's key is in
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -q 'PUBKEY-TO-COME' desktop/tauri.conf.json; then
            echo "::error::desktop/tauri.conf.json's plugins.updater.pubkey is still the placeholder"
            exit 1
          fi
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but desktop/Cargo.toml says $version"
            exit 1
          fi

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub has: its packages run on more systems.
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          # Apple Silicon, and Intel Macs, a .dmg each.
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    env:
      # The oldest macOS the app runs on, as tauri.conf.json says: for the
      # emulator and the SDL built into it, which would otherwise want the
      # runner's own. Big Sur, the first on Apple Silicon. Only macOS reads it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      # Tauri's CLI, its own build from its release: built here, it took
      # longer than anything else.
      - run: tools/install-tauri-cli 2.12.4
        shell: bash
      # With the updates the app installs itself, each signed with the
      # updater's key (TAURI_SIGNING_PRIVATE_KEY, and its password, from
      # `cargo tauri signer generate`), whose public half tauri.conf.json has.
      # A release has to have them; a run by hand without the key goes
      # without.
      - name: The app, and its updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            tools/build-desktop --config '{"bundle":{"createUpdaterArtifacts":true}}'
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::no TAURI_SIGNING_PRIVATE_KEY secret: a release has to have the app's updates"
            exit 1
          else
            echo "::warning::no TAURI_SIGNING_PRIVATE_KEY secret: no updates made"
            tools/build-desktop
          fi
      # The Mac's update is the app in a tarball, named the same on both
      # Macs: named for its version and processor, as the .dmg is.
      - name: The Mac's update named
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd desktop/target/release/bundle/macos
          if [ -f "Open Bus.app.tar.gz" ]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../../../Cargo.toml | head -n 1)
            arch=$([ "${{ matrix.name }}" = macos-arm64 ] && echo aarch64 || echo x64)
            for end in "" .sig; do
              mv "Open Bus.app.tar.gz$end" "Open Bus_${version}_${arch}.app.tar.gz$end"
            done
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/macos/*.app.tar.gz
            desktop/target/release/bundle/*/*.sig
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # The NDK before 27, and CMake 4: as tools/android-env says why. The
      # runner's ANDROID_NDK_HOME is its own newer NDK, so it's pointed at
      # this one.
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.2.11394342" "cmake;4.1.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
      # libclang, for SDL's bindings, made as it's built for 32-bit Android:
      # as Cargo.toml says why.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      # Tauri's CLI, its own build from its release: built here, it took
      # longer than anything else.
      - run: tools/install-tauri-cli 2.12.4
        shell: bash
      - name: The release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "::error::no ANDROID_KEYSTORE secret: a release's APK has to be signed with the release key"
              exit 1
            fi
            echo "::warning::no ANDROID_KEYSTORE secret: this APK won't install over a release"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > desktop/gen/android/keystore.properties
      - run: tools/build-android
      - name: Named for its version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n 1)
          mkdir -p out
          cp desktop/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "out/open-bus-$version.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For tools/updater-manifest.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # The artifacts keep their folders (deb/, dmg/ and the rest), so it's
      # their files that go up. A draft first, published once they're all
      # there; and run again, the release that's there already is used.
      - name: The release, and its files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Open Bus ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          # The desktop app's update manifest, which it checks for a newer
          # version: on the latest release, it's where the app looks.
          tools/updater-manifest artifacts "$GITHUB_REF_NAME" > artifacts/latest.json
          # The updates' signatures are in latest.json, where the app reads
          # them: their .sig files aren't put on the release.
          find artifacts -type f ! -name '*.sig' -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
