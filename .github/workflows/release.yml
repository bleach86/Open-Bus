# A version tag, v0.2.0 say: the desktop app's installers for Linux, Windows
# and macOS, and the Android APK, built and put on a GitHub release of that
# tag. Run by hand (Actions → Release → Run workflow), it builds them all as
# artifacts of the run, without a release.
#
# The APK is signed with the debug key, as tools/build-android signs it. For
# a release to install over the app already on a device, that has to be the
# same key: the repository's ANDROID_DEBUG_KEYSTORE secret, the keystore in
# base64 (`base64 -w0 ~/.android/debug.keystore`, or ~/.config/.android/'s).
# Without it, the APK is signed with a key made for the run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag has to be the version the app says it is.
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but desktop/Cargo.toml says $version"
            exit 1
          fi

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub has: its packages run on more systems.
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: tools/build-desktop
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The NDK before 27, and CMake 4: as tools/android-env says why.
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "ndk;26.2.11394342" "cmake;4.1.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: The debug key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::no ANDROID_DEBUG_KEYSTORE: this APK won't install over one signed with yours"
          fi
      - run: tools/build-android
      - name: Named for its version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n 1)
          mkdir -p out
          cp desktop/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "out/open-bus-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Open Bus ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
