# Open Bus as a desktop app: the web page's library in a window of its own,
# and the games on `cpu_emu`, the native emulator, beside it. By itself, not
# part of `cpu_emu`, which has none of this to build.
[package]
name = "open-bus"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bleach86/Open-Bus"
homepage = "https://obus.tuxprint.com/"

# A library too, as Android has the app: its activity loads it.
[lib]
name = "open_bus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = "3.5.2"

# WebKitGTK's own settings, for the same crate Tauri has.
# Android's, from the app's own side: the game screen started as Tauri's
# webview has the activity, by the same crate's version.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[workspace]
