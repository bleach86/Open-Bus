[package]
name = "cpu_emu"
version = "0.1.0"
edition = "2024"

[dependencies]
miniz_oxide = "0.9.1"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
sdl2 = { version = "0.38.0", features = ["unsafe_textures"] }
serde = { version = "1.0.229", features = ["derive"] }
