[package]
name = "cpu_emu"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

# An emulator's cycles go through every part of it, millions a second: all of
# it optimised as one, which a handheld's speed depends on.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
miniz_oxide = "0.9.1"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { version = "0.38.0", features = ["unsafe_textures"] }
# The program's command line.
clap = { version = "4.6.7", features = ["derive"] }

# Windows and Macs have no SDL of their own to link to: theirs is built with
# the program, and in it. That wants CMake, and a C compiler.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
sdl2 = { version = "0.38.0", features = ["bundled", "static-link", "unsafe_textures"] }

# Nor has Android: built with the NDK, but shared, for SDL's activity to
# load before the emulator.
[target.'cfg(target_os = "android")'.dependencies]
sdl2 = { version = "0.38.0", features = ["bundled", "unsafe_textures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
