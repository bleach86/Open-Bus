[package]
name = "cpu_emu"
version = "0.4.8"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bleach86/Open-Bus"
homepage = "https://obus.tuxprint.com/"

[lib]
crate-type = ["cdylib", "rlib"]

# An emulator's cycles go through every part of it, millions a second: all of
# it optimised as one, which a handheld's speed depends on.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
miniz_oxide = "0.9.1"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = "0.39.0"
# The program's command line.
clap = { version = "4.6.7", features = ["derive"] }
# The modem's socket, its receive buffer set small before it connects: what
# a place sends held back in the network, as a modem's flow control holds it.
socket2 = "0.6"
# Zimodem's secure connections (`ATCS`), the modem's TLS, as the network
# card's ESP32 does it: the desktop app's TLS too, by ring.
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

# Windows and Macs have no SDL of their own to link to, and a desktop Linux's
# may be older than this one wants (2.28 up): theirs is built with the
# program, and in it, SDL 2.32. That wants CMake, a C compiler, and on Linux
# the X11, Wayland and sound headers (libsdl2-dev brings them), for SDL to
# load those at run time. A Linux handheld's own SDL, with its screen's
# drivers in it, is linked to as it is.
[target.'cfg(any(windows, target_os = "macos", all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
sdl2 = { version = "0.39.0", features = ["bundled", "static-link"] }

# Nor has Android: built with the NDK, but shared, for SDL's activity to
# load before the emulator.
[target.'cfg(target_os = "android")'.dependencies]
sdl2 = { version = "0.39.0", features = ["bundled"] }

# On 32-bit Android, as many TVs' apps are, SDL's bindings made for it as it's
# built (by bindgen, which wants libclang): those sdl2-sys comes with are a
# 64-bit machine's, every struct the wrong size.
[target.'cfg(all(target_os = "android", target_pointer_width = "32"))'.dependencies]
sdl2 = { version = "0.39.0", features = ["bundled", "use-bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
