# A 64K cart whose program runs from RAM: 8 banks of 8K. Bank 0 holds the
# startup code, which copies the program (the segments CODE, RODATA and DATA,
# up to 24K) from banks 1-3 into RAM and runs it there. Banks 4-7 take turns
# at $A000 (or, the program being in RAM, at $8000 too) and hold the segments
# BANK4-BANK7. See sdk/cart.mk and docs/machine.md.
SYMBOLS {
    __CART_BANKS__: type = export, value = 8;
    __CART_SAVE__:  type = weak,   value = 0;      # K of save memory: ld65 -D
    __STACKSIZE__:  type = weak,   value = $0800;  # the heap stops this far below the stack top
    __PROGRAM_IN_RAM__: type = export, value = 1;  # crt0 copies the program into RAM
}
MEMORY {
    HDR:   start = $0000, size = $0020, type = ro, file = %O, fill = yes, fillval = 0;
    ICON:  start = $0000, size = $0250, type = ro, file = %O, fill = yes, fillval = 0;
    ZP:    start = $0010, size = $00F0, type = rw, file = "", define = yes;
    # All of RAM: the program, then bss and heap, the C stack growing down
    # from the top.
    RAM:   start = $0300, size = $7D00, type = rw, file = "", define = yes;
    BANK0: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 0;
    # Banks 1-3, one after another in the file: the program, as crt0 finds it.
    IMAGE: start = $A000, size = $6000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 1;
    BANK4:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 4;
    BANK5:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 5;
    BANK6:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 6;
    BANK7:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 7;
}
SEGMENTS {
    CARTHDR:  load = HDR,   type = ro;
    ICON:     load = ICON,  type = ro;
    ZEROPAGE: load = ZP,    type = zp;
    HEADER:   load = BANK0, type = ro, start = $8000;
    STARTUP:  load = BANK0, type = ro;
    ONCE:     load = BANK0, type = ro, optional = yes;
    CODE:     load = IMAGE, run = RAM, type = ro, define = yes;
    RODATA:   load = IMAGE, run = RAM, type = ro, define = yes;
    DATA:     load = IMAGE, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,   type = bss, define = yes;
    BANK4:    load = BANK4, type = ro, optional = yes;
    BANK5:    load = BANK5, type = ro, optional = yes;
    BANK6:    load = BANK6, type = ro, optional = yes;
    BANK7:    load = BANK7, type = ro, optional = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
