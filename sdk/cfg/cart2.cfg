# A 16K cart: banks 0 and 1, both mapped from reset and never switched, so
# the program sees 16K at $8000. See sdk/cart.mk and docs/machine.md.
SYMBOLS {
    __CART_BANKS__: type = export, value = 2;
    __CART_SAVE__:  type = weak,   value = 0;      # K of save memory: ld65 -D
    __STACKSIZE__:  type = weak,   value = $0800;  # the heap stops this far below the stack top
    __PROGRAM_IN_RAM__: type = export, value = 0;  # the program runs from the cart
}
MEMORY {
    HDR:   start = $0000, size = $0020, type = ro, file = %O, fill = yes, fillval = 0;
    ICON:  start = $0000, size = $0250, type = ro, file = %O, fill = yes, fillval = 0;
    ZP:    start = $0010, size = $00F0, type = rw, file = "", define = yes;
    # All of RAM: data, bss and heap, the C stack growing down from the top.
    RAM:   start = $0300, size = $7D00, type = rw, file = "", define = yes;
    ROM:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    CARTHDR:  load = HDR,   type = ro;
    ICON:     load = ICON,  type = ro;
    ZEROPAGE: load = ZP,    type = zp;
    HEADER:   load = ROM,   type = ro, start = $8000;
    STARTUP:  load = ROM,   type = ro;
    ONCE:     load = ROM,   type = ro, optional = yes;
    CODE:     load = ROM,   type = ro, define = yes;
    RODATA:   load = ROM,   type = ro;
    DATA:     load = ROM,   type = rw, run = RAM, define = yes;
    BSS:      load = RAM,   type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
