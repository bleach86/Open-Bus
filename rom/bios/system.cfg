# System ROM: the BIOS (rom/bios) and the system software, the menu and the
# shell (rom/system), 16K at $C000. See sdk/include/machine.inc for the memory
# map.
MEMORY {
    BIOSZP:  start = $0000, size = $0010, type = rw, file = "";
    # The system software is the running software when no cart is: it has
    # the rest of the zero page and all of RAM.
    ZP:      start = $0010, size = $00F0, type = rw, file = "";
    # The BIOS's page: the RAM vectors (machine.inc) at $0200, then its own.
    BIOSRAM: start = $0204, size = $00FC, type = rw, file = "";
    RAM:     start = $0300, size = $7D00, type = rw, file = "", define = yes;
    ROM:     start = $C000, size = $3F00, type = ro, file = %O, fill = yes, fillval = $FF;
    # I/O registers: decoded by the hardware, not the ROM.
    IO:      start = $FF00, size = $00FA, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $FFFA, size = $0006, type = ro, file = %O;
}
SEGMENTS {
    BIOSZP:    load = BIOSZP,  type = zp;
    ZEROPAGE:  load = ZP,      type = zp;
    BIOSRAM:   load = BIOSRAM, type = bss;
    JUMPTABLE: load = ROM,     type = ro, start = $C000;
    STARTUP:   load = ROM,     type = ro;
    ONCE:      load = ROM,     type = ro, optional = yes;
    CODE:      load = ROM,     type = ro;
    RODATA:    load = ROM,     type = ro;
    DATA:      load = ROM,     type = rw, run = RAM, define = yes;
    BSS:       load = RAM,     type = bss, define = yes;
    VECTORS:   load = VECTORS, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
